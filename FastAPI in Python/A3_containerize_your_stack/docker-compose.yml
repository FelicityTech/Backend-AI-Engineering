version: "3.9"

services:
  db:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    depends_on:
      - db

    env_file:
      - .env

    ports:
      - "8000:8000"

volumes:
  postgres_data:
